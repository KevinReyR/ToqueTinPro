name: ToqueTin
options:
  bundleIdPrefix: com.toquetin
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 47LCR3FMKT
    TRACKING_BASE_URL: "https://toquetinpro-web.onrender.com"
targets:
  OrderTrackingCore:
    type: framework
    platform: iOS
    sources: [Sources/OrderTrackingCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toquetin.app.OrderTrackingCore
        GENERATE_INFOPLIST_FILE: YES
  TrackingUI:
    type: framework
    platform: iOS
    sources: [Sources/TrackingUI]
    dependencies:
      - target: OrderTrackingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toquetin.app.TrackingUI
        GENERATE_INFOPLIST_FILE: YES
  ToqueTin:
    type: application
    platform: iOS
    sources: [Sources/ToqueTinApp]
    dependencies:
      - target: OrderTrackingCore
      - target: TrackingUI
      - target: OrderLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toquetin.app
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ToqueTin.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/ToqueTin-Debug.entitlements
  ToqueTinClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [Sources/ToqueTinClip]
    dependencies:
      - target: OrderTrackingCore
      - target: TrackingUI
      - target: OrderClipLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toquetin.app.clip
        INFOPLIST_FILE: Config/Clip-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ToqueTinClip.entitlements
  OrderLiveActivity:
    type: app-extension
    platform: iOS
    sources: [Sources/OrderLiveActivity]
    dependencies:
      - target: OrderTrackingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toquetin.app.liveactivity
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/OrderLiveActivity.entitlements
  OrderClipLiveActivity:
    type: app-extension
    platform: iOS
    sources: [Sources/OrderLiveActivity]
    dependencies:
      - target: OrderTrackingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toquetin.app.clip.liveactivity
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/OrderClipLiveActivity.entitlements
  OrderTrackingCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/OrderTrackingCoreTests]
    dependencies:
      - target: OrderTrackingCore
schemes:
  ToqueTin:
    build:
      targets:
        ToqueTin: all
        OrderTrackingCoreTests: [test]
    test:
      targets: [OrderTrackingCoreTests]
  ToqueTinClip:
    build:
      targets:
        ToqueTinClip: all
