services:
  - type: web
    name: toquetinpro-web
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://toquetinpro-web.onrender.com
      - key: TRACKING_TOKEN_SECRET
        generateValue: true
      - key: DELIVERY_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: APPLE_TEAM_ID
        value: 47LCR3FMKT
      - key: APPLE_APP_BUNDLE_ID
        value: com.toquetin.app
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: N8N_WHATSAPP_DELIVERY_WEBHOOK_URL
        sync: false
      - key: PRIVACY_CONTROLLER_NAME
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: PRIVACY_POLICY_VERSION
        value: 2026-09-23
