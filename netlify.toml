[build]
  command = "pnpm build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.19.0"
  # Public application metadata is intentionally committed or embedded in the client bundle.
  # Private runtime credentials are injected by Netlify and never written to the repository.
  SECRETS_SCAN_OMIT_KEYS = "ANDROID_PACKAGE_NAME,APPLE_APP_BUNDLE_ID,APPLE_TEAM_ID,APNS_PRIVATE_KEY,DELIVERY_TOKEN_ENCRYPTION_KEY,FCM_PRIVATE_KEY,N8N_WEBHOOK_SECRET,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_VAPID_PUBLIC_KEY,PRIVACY_POLICY_VERSION,SUPABASE_SERVICE_ROLE_KEY,TRACKING_TOKEN_SECRET,VAPID_PRIVATE_KEY,VAPID_PUBLIC_KEY"
